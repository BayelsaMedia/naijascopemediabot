services:
  - type: web
    name: naijascope-media-bot
    env: node
    rootDir: naijascopemediabot
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_NUMBER
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
